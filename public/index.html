<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ML Tournament Registration</title>
  <link rel="canonical" href="https://ml-tornament.onrender.com/" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="64x64" href="icon-64.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ML Tournament" />
  <meta name="description" content="Register your team, follow the bracket, and get match updates for the PCC Mobile Legends tournament." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ML Tournament" />
  <meta property="og:title" content="ML Tournament Registration" />
  <meta property="og:description" content="Register your team, follow the bracket, and get match updates for the PCC Mobile Legends tournament." />
  <meta property="og:url" content="https://ml-tornament.onrender.com/" />
  <meta property="og:image" content="https://ml-tornament.onrender.com/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ML Tournament crest with the words Registration and Bracket Control" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ML Tournament Registration" />
  <meta name="twitter:description" content="Register your team, follow the bracket, and get match updates for the PCC Mobile Legends tournament." />
  <meta name="twitter:image" content="https://ml-tornament.onrender.com/og-image.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <span class="brand-mark"><img src="icon-64.png" alt="" /></span>
      <div class="brand-text">
        <span class="brand">ML Tournament</span>
        <span class="brand-sub">Registration &amp; Bracket Control</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="installBtn" class="btn small install" type="button" hidden aria-label="Install app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v11" /><path d="m7 10 5 5 5-5" /><path d="M5 20h14" />
        </svg>
        <span class="install-label">Install app</span>
      </button>
      <div id="userbox" class="userbox" hidden>
        <span class="user-chip">
          <span id="avatar" class="avatar"></span>
          <span id="userLabel" class="user-email"></span>
        </span>
        <span id="rolePill" class="role-pill" hidden>Admin</span>
        <button id="logoutBtn" class="btn small ghost">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <!-- LOGIN / REGISTER -->
    <section id="viewAuth" class="auth-wrap">
      <div class="auth-stack">
        <div class="auth-hero">
          <img src="icon.png" alt="" />
          <div class="hero-copy">
            <span class="hero-kicker">PCC Esports</span>
            <strong class="hero-title">Mobile Legends Tournament</strong>
            <span class="hero-sub">Register your squad. Track the bracket.</span>
          </div>
        </div>
        <div class="card auth-card">
        <div class="tabs" id="authTabs">
          <button data-form="loginForm" class="active">Login</button>
          <button data-form="registerForm">Register</button>
          <button data-form="adminForm">Admin</button>
        </div>

        <form id="loginForm" class="form">
          <label>Email<input type="email" name="email" required autocomplete="email" /></label>
          <label>Password<input type="password" name="password" required autocomplete="current-password" /></label>
          <button class="btn" type="submit">Log in</button>
        </form>

        <form id="registerForm" class="form" hidden>
          <label>Full Name<input name="fullName" required /></label>
          <div class="grid2">
            <label>School ID<input name="schoolId" required /></label>
            <label>Program<input name="program" placeholder="e.g. BSIT" required /></label>
          </div>
          <label>Email (notifications are sent here)<input type="email" name="email" required /></label>
          <label>IGN (in-game name)<input name="ign" required /></label>
          <label>Password (min. 8 characters)<input type="password" name="password" minlength="8" required autocomplete="new-password" /></label>
          <button class="btn" type="submit">Create account</button>
        </form>

        <form id="adminForm" class="form" hidden>
          <p class="muted">Administrator access only.</p>
          <label>Admin Email<input type="email" name="email" required /></label>
          <label>Password<input type="password" name="password" required /></label>
          <button class="btn dark" type="submit">Log in</button>
        </form>
        </div>
      </div>
    </section>

    <!-- LOGGED-IN APP (user and admin share this shell) -->
    <section id="viewApp" hidden>
      <nav class="tabs main-tabs" id="mainTabs"></nav>
      <div id="panel" class="panel"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
